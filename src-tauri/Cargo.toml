[package]
name = "vocalibre"
description = "100% local voice dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "vocalibre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
cpal = "=0.18.2"
rubato = "=5.0.1"
rtrb = "=0.4.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal", "tracing_backend"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["vulkan", "tracing_backend"] }
