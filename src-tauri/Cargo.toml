[package]
name = "vocalibre"
description = "100% local voice dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "vocalibre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
cpal = "=0.18.2"
rubato = "=5.0.1"
rtrb = "=0.4.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "=2.13.3"
sys-locale = "=0.3.2"
arboard = "=3.7.0"
enigo = "=0.6.1"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "=0.2.5"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal", "tracing_backend"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["vulkan", "tracing_backend"] }
