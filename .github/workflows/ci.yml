# On every push to develop and every pull request: formatting, lints, tests,
# then a build of the installers on the three systems (downloadable from the
# run's page). main only receives commits already checked on develop, so
# pushing both at once runs the checks once.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Portable whisper.cpp: never tuned to the CI machine's processor.
  GGML_NATIVE: "OFF"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Typecheck and build the interface
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            x86: true
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
            x86: true
          - name: Linux
            os: ubuntu-22.04
            x86: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: x86-64 baseline (AVX2)
        if: matrix.x86
        shell: bash
        run: printf 'GGML_AVX=ON\nGGML_AVX2=ON\nGGML_FMA=ON\nGGML_F16C=ON\n' >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      # Updater packages need the signing key, which pull requests do not get.
      - name: Build
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vocalibre-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
